server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints filenames in /assets, so these are safe to cache
    # forever — a new deploy produces new URLs, never a mutated old one.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is not fingerprinted and references the current
    # fingerprinted assets, so it must always be revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any path that doesn't match a real file (e.g. a
    # client-side route like /products/slug) falls back to index.html
    # so react-router-dom can render it instead of NGINX 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
